---
- name: Инициализация Kubernetes Master
  hosts: master
  become: yes
  tasks:
    - name: Инициализация кластера (kubeadm init)
      command: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Создание директории .kube для пользователя ubuntu
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Копирование конфига кластера (admin.conf)
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Установка сетевого плагина (Flannel CNI)
      become: no
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      
    - name: Генерация команды для подключения worker-ноды
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Сохранение join-команды в fact для передачи на воркер
      set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"


- name: Подключение Worker-ноды к кластеру
  hosts: worker
  become: yes
  tasks:
    - name: Выполнение команды join
      command: "{{ hostvars['master'].join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf